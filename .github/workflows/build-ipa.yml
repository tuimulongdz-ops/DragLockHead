name: Build IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug cấu trúc repo
        run: |
          ls -la
          ls -la DragLockHead || true
          ls -la DragLockHead/web || true

      - name: Chọn Xcode mới nhất
        run: |
          XC=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "Chọn: $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> $GITHUB_ENV

      - name: Cài XcodeGen (tránh lỗi permission)
        run: |
          # Cài đặt vào thư mục người dùng thay vì /usr/local
          export XCODEGEN_PREFIX="$HOME/.local"
          brew install xcodegen || {
            echo "Homebrew thất bại, thử cài từ source..."
            git clone https://github.com/yonaskolb/XcodeGen.git /tmp/xcodegen
            cd /tmp/xcodegen
            swift build -c release
            mkdir -p "$HOME/.local/bin"
            cp .build/release/xcodegen "$HOME/.local/bin/"
            echo "$HOME/.local/bin" >> $GITHUB_PATH
          }
          # Nếu brew thành công, thêm đường dẫn mặc định
          which xcodegen || echo "$HOME/.local/bin/xcodegen"

      - name: Sinh project
        run: |
          xcodegen generate
          xcodebuild -list -project DragLockHead.xcodeproj

      - name: Build app
        run: |
          xcodebuild \
            -project DragLockHead.xcodeproj \
            -scheme DragLockHead \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            ENABLE_BITCODE=NO \
            ONLY_ACTIVE_ARCH=NO \
            clean build

      - name: Đóng gói IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/DragLockHead.app Payload/
          zip -qr DragLockHead.ipa Payload/
          rm -rf Payload
          ls -lh DragLockHead.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DragLockHead-IPA
          path: DragLockHead.ipa
          retention-days: 30
