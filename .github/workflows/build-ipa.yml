name: Build IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Hiển thị môi trường
        run: |
          sw_vers
          xcodebuild -version
          ls /Applications | grep -i xcode

      - name: Cài XcodeGen
        run: brew install xcodegen

      - name: Sinh project
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild \
            -project DragLockHead.xcodeproj \
            -scheme DragLockHead \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            ENABLE_BITCODE=NO \
            ONLY_ACTIVE_ARCH=NO \
            clean build

      - name: Đóng gói IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/DragLockHead.app Payload/
          zip -qr DragLockHead.ipa Payload/
          rm -rf Payload

      - uses: actions/upload-artifact@v4
        with:
          name: DragLockHead-IPA
          path: DragLockHead.ipa
