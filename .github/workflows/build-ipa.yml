name: Build IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug cấu trúc
        run: |
          ls -la
          ls -la DragLockHead || true
          ls -la DragLockHead/web || true

      - name: Chọn Xcode mới nhất
        run: |
          XC=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "Chọn: $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version

      - name: Cài XcodeGen
        run: brew install xcodegen

      - name: Sinh project
        run: |
          xcodegen generate
          xcodebuild -list -project DragLockHead.xcodeproj

      - name: Build app
        run: |
          xcodebuild \
            -project DragLockHead.xcodeproj \
            -scheme DragLockHead \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            ENABLE_BITCODE=NO \
            ONLY_ACTIVE_ARCH=NO \
            clean build

      - name: Đóng gói IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/DragLockHead.app Payload/
          zip -qr DragLockHead.ipa Payload/
          rm -rf Payload
          ls -lh DragLockHead.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DragLockHead-IPA
          path: DragLockHead.ipa
          retention-days: 30
