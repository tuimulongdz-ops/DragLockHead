name: DragLockHead
options:
  bundleIdPrefix: com.zwilz
  deploymentTarget:
    iOS: "14.0"
  createIntermediateGroups: true

targets:
  DragLockHead:
    type: application
    platform: iOS
    sources:
      - path: DragLockHead
    info:
      path: DragLockHead/Info.plist
      properties:
        CFBundleDevelopmentRegion: vi
        CFBundleDisplayName: Zwilz HLong
        CFBundleShortVersionString: "8.0.0"
        CFBundleVersion: "20251011"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIBackgroundModes:
          - audio
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsArbitraryLoadsInWebContent: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zwilz.draglockhead
        PRODUCT_NAME: DragLockHead
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "8.0.0"
        CURRENT_PROJECT_VERSION: "20251011"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_BITCODE: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_IDENTITY: ""
